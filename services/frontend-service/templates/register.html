{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
    <h1>Register</h1>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="firstname" placeholder="First Name" value="{{ firstname or '' }}" required>
        <input type="text" name="surname" placeholder="Surname" value="{{ surname or '' }}" required>
        <input type="email" name="email" placeholder="Email" value="{{ email or '' }}" required>
        <div class="note">Must contain '@' (e.g., name@example.com)</div>
        <input type="password" name="password" placeholder="Password" required>
        <div class="note">Password must be 5–50 characters</div>
        <button type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
