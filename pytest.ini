[pytest]
# `pytest` on its own runs only the unit tests: no Docker or cluster needed.
# Integration tests need the deployed system:  pytest tests/integration
testpaths = tests/unit
addopts = -ra --strict-markers
markers =
    tc(id): links the test to a test case in docs/v<release>/test-management.xlsx (e.g. UT-001)
    disruptive: restarts the database or redeploys the system; always runs last
