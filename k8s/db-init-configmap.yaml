apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  # Idempotent: safe to run on every deploy. It only creates what is missing
  # and never drops data (the database lives on a persistent volume).
  # Run with: sqlcmd -I (QUOTED_IDENTIFIER ON, needed for the filtered index)
  #           -v USER_DB_PASSWORD=... PRODUCT_DB_PASSWORD=... ORDER_DB_PASSWORD=...
  init.sql: |
    USE master;
    GO
    IF DB_ID('UsersDB') IS NULL CREATE DATABASE UsersDB;
    IF DB_ID('ProductsDB') IS NULL CREATE DATABASE ProductsDB;
    IF DB_ID('OrdersDB') IS NULL CREATE DATABASE OrdersDB;
    GO

    -- ============================================
    -- One SQL login per service (least privilege).
    -- Passwords come from the Kubernetes Secret; ALTER keeps them in sync if
    -- the Secret is rotated.
    -- ============================================
    IF SUSER_ID('user_svc') IS NULL
        CREATE LOGIN user_svc WITH PASSWORD = N'$(USER_DB_PASSWORD)', DEFAULT_DATABASE = UsersDB;
    ELSE
        ALTER LOGIN user_svc WITH PASSWORD = N'$(USER_DB_PASSWORD)';
    IF SUSER_ID('product_svc') IS NULL
        CREATE LOGIN product_svc WITH PASSWORD = N'$(PRODUCT_DB_PASSWORD)', DEFAULT_DATABASE = ProductsDB;
    ELSE
        ALTER LOGIN product_svc WITH PASSWORD = N'$(PRODUCT_DB_PASSWORD)';
    IF SUSER_ID('order_svc') IS NULL
        CREATE LOGIN order_svc WITH PASSWORD = N'$(ORDER_DB_PASSWORD)', DEFAULT_DATABASE = OrdersDB;
    ELSE
        ALTER LOGIN order_svc WITH PASSWORD = N'$(ORDER_DB_PASSWORD)';
    GO

    -- ============================================
    -- UsersDB
    -- ============================================
    USE UsersDB;
    GO
    IF OBJECT_ID('dbo.Users') IS NULL
    BEGIN
        CREATE TABLE dbo.Users (
            Id INT IDENTITY PRIMARY KEY,
            Firstname NVARCHAR(50) NOT NULL,
            Surname NVARCHAR(50) NOT NULL,
            Email NVARCHAR(50) NOT NULL UNIQUE CHECK (Email LIKE '%_@_%'),
            -- Only a salted hash is stored, never the password itself.
            PasswordHash NVARCHAR(255) NOT NULL
        );
        -- Seed users. Plain-text passwords for manual testing:
        --   Alice: Pass12345   Brian: SecurePass9   Clara: MyPassword123
        INSERT INTO dbo.Users (Firstname, Surname, Email, PasswordHash)
        VALUES
        (N'Alice', N'Anderson', N'alice.anderson@example.com', N'scrypt:32768:8:1$R1A302ypoIpoOU1j$798a71054c3beaad4f44aa25673f11e89010f387540a1c3c1c1c201d6c997d6f026640d2caa6319f781aad67ec5a5a9aebb686c82d846d4ae43b2d4c12599c79'),
        (N'Brian', N'Bergström', N'brian.bergstrom@example.com', N'scrypt:32768:8:1$syDS9E47t3dhsfmi$06870938fe110e7ec50fd499afbe9663dcf1e7d7482c3be2391a56ae03b034447a29d9326f20f97e1e13dabed41c7f238376fda8991a70eb3fb703232839ffac'),
        (N'Clara', N'Carlsson', N'clara.carlsson@example.com', N'scrypt:32768:8:1$h1FcrX2BoqOMizjO$a485be44741d63fe553b5ed4aab2eee4f08763840fe4fd890d65ea0276ea887393af1d975567f41ba6c3c0240e2d3c4fb0d3f4cc9d06b1b590d3b2dc794cf08d');
    END
    GO
    IF USER_ID('user_svc') IS NULL CREATE USER user_svc FOR LOGIN user_svc;
    GRANT SELECT, INSERT, DELETE ON dbo.Users TO user_svc;
    GO

    -- ============================================
    -- ProductsDB
    -- ============================================
    USE ProductsDB;
    GO
    IF OBJECT_ID('dbo.Products') IS NULL
        CREATE TABLE dbo.Products (
            Id INT IDENTITY PRIMARY KEY,
            Name NVARCHAR(50) NOT NULL,
            Price DECIMAL(10,2) NOT NULL CHECK (Price >= 0),
            Stock INT NOT NULL DEFAULT 0 CHECK (Stock >= 0)
        );
    GO
    -- Added in release 1.2. A separate step, so new databases and databases
    -- created by 1.1 go through the same code. Both columns are optional.
    IF COL_LENGTH('dbo.Products', 'Description') IS NULL
        ALTER TABLE dbo.Products ADD Description NVARCHAR(500) NULL;
    IF COL_LENGTH('dbo.Products', 'ImageFile') IS NULL
        ALTER TABLE dbo.Products ADD ImageFile NVARCHAR(100) NULL;   -- file name only, e.g. ear-plugs.jpg
    GO
    -- Renamed in release 1.2: generic names instead of brand names. Only the
    -- old name is changed, so a product that was renamed by hand is left alone.
    -- Old orders keep the name they were placed with (OrderItems.ProductName).
    UPDATE dbo.Products SET Name = N'Gaming Laptop 15'            WHERE Id = 1 AND Name = N'Asus TUF 15';
    UPDATE dbo.Products SET Name = N'2-in-1 Laptop 13'            WHERE Id = 2 AND Name = N'Lenovo Yoga 3';
    UPDATE dbo.Products SET Name = N'Noise-Cancelling Headphones' WHERE Id = 3 AND Name = N'JBL 775 NC';
    UPDATE dbo.Products SET Name = N'Bunny Ears Headband'         WHERE Id = 6 AND Name = N'Cat Ears headband';
    GO
    -- The assortment (release 1.2: 20 products). Runs on every deploy:
    --   * a product whose id is missing is added;
    --   * a product without a description or image gets one;
    --   * nothing else is changed, so stock and prices are never reset.
    -- Images are served by frontend-service from static/products/ (see CREDITS.md).
    DECLARE @Assortment TABLE (
        Id INT PRIMARY KEY, Name NVARCHAR(50), Price DECIMAL(10,2), Stock INT,
        Description NVARCHAR(500), ImageFile NVARCHAR(100));
    INSERT INTO @Assortment (Id, Name, Price, Stock, Description, ImageFile)
    VALUES
    (1,  N'Gaming Laptop 15', 9999.95, 15,
         N'15-inch gaming laptop with a fast screen, a dedicated graphics card and a backlit keyboard.', N'gaming-laptop-15.jpg'),
    (2,  N'2-in-1 Laptop 13', 13000, 10,
         N'13-inch laptop that turns into a tablet: detach the keyboard cover and use the touchscreen with the pen.', N'2-in-1-laptop-13.jpg'),
    (3,  N'Noise-Cancelling Headphones', 1200, 55,
         N'Over-ear headphones with active noise cancelling and a hard carrying case.', N'noise-cancelling-headphones.jpg'),
    (4,  N'Powerbank 5000mah', 99.95, 500,
         N'Compact 5000 mAh power bank that charges a phone about once. Fits in a pocket.', N'powerbank-5000mah.jpg'),
    (5,  N'Ear Plugs', 9.95, 550,
         N'Soft foam ear plugs for sleep, travel and noisy work.', N'ear-plugs.jpg'),
    (6,  N'Bunny Ears Headband', 149.50, 310,
         N'Fluffy bunny ears on a comfortable headband, for parties, costumes and photos.', N'bunny-ears-headband.jpg'),
    (7,  N'Wireless Mouse', 24.95, 120,
         N'Ergonomic wireless mouse with a USB receiver and quiet clicks.', N'wireless-mouse.jpg'),
    (8,  N'Mechanical Keyboard', 89.00, 60,
         N'Mechanical keyboard with tactile switches and colourful backlighting.', N'mechanical-keyboard.jpg'),
    (9,  N'27-inch Monitor', 249.00, 25,
         N'27-inch monitor with thin bezels, for work and entertainment.', N'27-inch-monitor.jpg'),
    (10, N'Webcam 1080p', 59.95, 80,
         N'Full HD webcam with a built-in microphone. Clips onto a laptop or monitor.', N'webcam-1080p.jpg'),
    (11, N'USB-C Hub', 39.95, 150,
         N'Compact USB-C hub that adds extra USB ports to your laptop.', N'usb-c-hub.jpg'),
    (12, N'USB-C Cable 1m', 12.95, 300,
         N'1-metre USB-C cable for charging and data transfer.', N'usb-c-cable-1m.jpg'),
    (13, N'Laptop Backpack', 69.00, 45,
         N'Anti-theft backpack with a padded compartment for laptops up to 15 inches.', N'laptop-backpack.jpg'),
    (14, N'External SSD 1TB', 119.00, 40,
         N'Portable 1 TB solid state drive with fast USB-C transfer, small enough for a pocket.', N'external-ssd-1tb.jpg'),
    (15, N'Bluetooth Speaker', 79.95, 70,
         N'Portable Bluetooth speaker with rich sound, for indoors and outdoors.', N'bluetooth-speaker.jpg'),
    (16, N'Smartwatch', 199.00, 35,
         N'Smartwatch with heart-rate monitoring, sleep tracking and phone notifications.', N'smartwatch.jpg'),
    (17, N'Wireless Earbuds', 99.99, 90,
         N'True wireless earbuds with a charging case and touch controls.', N'wireless-earbuds.jpg'),
    (18, N'Gaming Headset', 100.00, 50,
         N'Over-ear gaming headset with a microphone and soft ear cushions.', N'gaming-headset.jpg'),
    (19, N'Phone Stand', 14.95, 200,
         N'Wooden phone stand for your desk.', N'phone-stand.jpg'),
    (20, N'HDMI Cable 2m', 9.99, 250,
         N'2-metre HDMI cable for connecting a laptop or console to a monitor or TV.', N'hdmi-cable-2m.jpg');

    SET IDENTITY_INSERT dbo.Products ON;
    INSERT INTO dbo.Products (Id, Name, Price, Stock, Description, ImageFile)
    SELECT a.Id, a.Name, a.Price, a.Stock, a.Description, a.ImageFile
    FROM @Assortment a
    WHERE NOT EXISTS (SELECT 1 FROM dbo.Products p WHERE p.Id = a.Id);
    SET IDENTITY_INSERT dbo.Products OFF;

    UPDATE p
    SET Description = COALESCE(NULLIF(p.Description, N''), a.Description),
        ImageFile   = COALESCE(NULLIF(p.ImageFile, N''), a.ImageFile)
    FROM dbo.Products p
    JOIN @Assortment a ON a.Id = p.Id
    WHERE NULLIF(p.Description, N'') IS NULL OR NULLIF(p.ImageFile, N'') IS NULL;
    GO
    IF USER_ID('product_svc') IS NULL CREATE USER product_svc FOR LOGIN product_svc;
    -- No INSERT/DELETE: the service only reads products and changes stock.
    GRANT SELECT, UPDATE ON dbo.Products TO product_svc;
    GO

    -- ============================================
    -- OrdersDB: one order (header) with one line per product.
    -- ============================================
    USE OrdersDB;
    GO
    IF OBJECT_ID('dbo.Orders') IS NULL
    BEGIN
        CREATE TABLE dbo.Orders (
            Id INT IDENTITY PRIMARY KEY,
            -- NULL once the user has deleted their account (order is anonymized).
            UserId INT NULL,
            CreatedAt DATETIME2(0) NOT NULL DEFAULT SYSUTCDATETIME(),
            IdempotencyKey NVARCHAR(64) NULL
        );
        -- Same key can only create one order. Filtered so many NULLs are allowed.
        CREATE UNIQUE INDEX UX_Orders_IdempotencyKey ON dbo.Orders (IdempotencyKey)
            WHERE IdempotencyKey IS NOT NULL;
        CREATE INDEX IX_Orders_UserId ON dbo.Orders (UserId);

        CREATE TABLE dbo.OrderItems (
            Id INT IDENTITY PRIMARY KEY,
            OrderId INT NOT NULL REFERENCES dbo.Orders (Id) ON DELETE CASCADE,
            ProductId INT NOT NULL,
            -- Name and price are copied at purchase time, so later price
            -- changes do not rewrite old orders.
            ProductName NVARCHAR(50) NOT NULL,
            UnitPrice DECIMAL(10,2) NOT NULL CHECK (UnitPrice >= 0),
            Quantity INT NOT NULL CHECK (Quantity > 0)
        );

        INSERT INTO dbo.Orders (UserId) VALUES (1);
        INSERT INTO dbo.OrderItems (OrderId, ProductId, ProductName, UnitPrice, Quantity)
        VALUES (SCOPE_IDENTITY(), 2, N'2-in-1 Laptop 13', 13000, 3);
    END
    GO
    IF USER_ID('order_svc') IS NULL CREATE USER order_svc FOR LOGIN order_svc;
    -- UPDATE is needed to anonymize orders; no DELETE.
    GRANT SELECT, INSERT, UPDATE ON dbo.Orders TO order_svc;
    GRANT SELECT, INSERT ON dbo.OrderItems TO order_svc;
    GO

    PRINT 'Database initialization complete.';
    GO
